name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Avvio manuale. Indicando un tag si pubblica la release definitiva: il
  # tag viene creato da GitHub sul commit di questo avvio, senza bisogno di
  # spingerlo da git.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag della release definitiva (es. v1.0.0). Vuoto = solo build."
        required: false
        default: ""
      highlights:
        description: "Novità di questa versione, in cima alle note. Vuoto = solo il testo fisso."
        required: false
        default: ""

permissions:
  contents: write

# Un push nuovo annulla la build precedente ancora in corso.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Se qualcosa si impianta si fallisce presto invece di restare appesi.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi statica
        run: flutter analyze

      - name: Test
        # I golden sono esclusi: dipendono dal rendering del testo della
        # macchina che li ha generati.
        run: flutter test --exclude-tags golden

      - name: Compila l'APK di release
        run: flutter build apk --release
        timeout-minutes: 20

      # Un APK per architettura pesa un terzo di quello universale: si
      # scarica prima e lascia meno spazio all'ipotesi del download
      # incompleto, che sul telefono si manifesta come "app non installata".
      - name: Compila gli APK per singola architettura
        run: flutter build apk --release --split-per-abi
        timeout-minutes: 20

      - name: Prepara i file da pubblicare
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/vtm-companion.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/vtm-companion-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             dist/vtm-companion-arm32.apk
          ls -la dist

      # Il testo fisso sta in .github/release-notes.md, dove si legge e si
      # corregge senza combattere con l'indentazione dello YAML. Sopra ci
      # finiscono le novita' della versione, se l'avvio manuale le indica.
      - name: Prepara le note della release
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          {
            if [ -n "$HIGHLIGHTS" ]; then
              printf '## Novità di questa versione\n\n%s\n\n' "$HIGHLIGHTS"
            fi
            cat .github/release-notes.md
          } > note-release.md
          cat note-release.md

      - name: Pubblica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtm-companion-apk
          path: dist/*.apk
          retention-days: 90

      # Release fissa "build-latest": dà un link diretto, comodo da aprire
      # dal telefono per installare l'app.
      - name: Aggiorna la release di sviluppo
        if: >-
          github.event_name == 'push'
          && (github.ref == 'refs/heads/main'
              || github.ref == 'refs/heads/claude/vtm-flutter-app-lde0ch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Ultima build
          body: |
            APK di sviluppo generato automaticamente dal commit ${{ github.sha }}.

            Quale scaricare:

            - `vtm-companion-arm64.apk` — praticamente tutti i telefoni degli
              ultimi anni. E' il piu' leggero: prova prima questo.
            - `vtm-companion-arm32.apk` — telefoni piu' vecchi a 32 bit.
            - `vtm-companion.apk` — universale, va su tutto ma pesa il triplo.

            Serve autorizzare l'installazione da origini sconosciute.

            Se aggiorni, riscarica lo **stesso file** che avevi installato:
            i tre APK hanno serie di numeri di build diverse, e passare
            dall'arm64 all'universale per Android e' un ritorno indietro,
            quindi lo rifiuta. Se sul telefono c'e' ancora una versione
            anteriore al 5 agosto 2026, disinstallala: era firmata con
            un'altra chiave.
          prerelease: true
          files: dist/*.apk

      - name: Release definitiva
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          make_latest: true
          files: dist/*.apk
          generate_release_notes: true
          body_path: note-release.md
