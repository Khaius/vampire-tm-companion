name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi statica
        run: flutter analyze

      - name: Test
        # I golden sono esclusi: dipendono dal rendering del testo della
        # macchina che li ha generati.
        run: flutter test --exclude-tags golden

      - name: Compila l'APK di release
        run: flutter build apk --release

      - name: Rinomina l'APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/vtm-companion.apk
          ls -la dist

      - name: Pubblica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtm-companion-apk
          path: dist/vtm-companion.apk
          retention-days: 90

      # Release fissa "build-latest": dà un link diretto, comodo da aprire
      # dal telefono per installare l'app.
      - name: Aggiorna la release di sviluppo
        if: github.ref == 'refs/heads/claude/vtm-flutter-app-lde0ch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Ultima build
          body: |
            APK di sviluppo generato automaticamente dal commit ${{ github.sha }}.

            Scarica `vtm-companion.apk` e installalo sul telefono
            (serve autorizzare l'installazione da origini sconosciute).
          prerelease: true
          files: dist/vtm-companion.apk

      - name: Release definitiva sui tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vtm-companion.apk
          generate_release_notes: true
