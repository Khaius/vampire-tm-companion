<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="480" height="480">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A1E20"/>
      <stop offset="0.55" stop-color="#511316"/>
      <stop offset="1" stop-color="#340C0F"/>
    </linearGradient>
    <linearGradient id="topLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E181B"/>
      <stop offset="1" stop-color="#3A0F12"/>
    </linearGradient>
    <linearGradient id="topRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#671A1D"/>
      <stop offset="1" stop-color="#3E1013"/>
    </linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#421215"/>
      <stop offset="1" stop-color="#22080A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C0B0E"/>
      <stop offset="1" stop-color="#1A0507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#C42E28" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#C42E28" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="24" cy="24" rx="23" ry="23" fill="url(#glow)"/>

  <!-- facce inferiori -->
  <path d="M13.9 23.2 24 30.6 24 44.4 9.8 33.4Z" fill="url(#lower)"/>
  <path d="M34.1 23.2 24 30.6 24 44.4 38.2 33.4Z" fill="url(#lower)"/>
  <!-- facce laterali -->
  <path d="M5.6 18.8 13.9 23.2 9.8 33.4Z" fill="url(#side)"/>
  <path d="M42.4 18.8 34.1 23.2 38.2 33.4Z" fill="url(#side)"/>
  <!-- facce superiori -->
  <path d="M24 3.6 13.9 23.2 5.6 18.8Z" fill="url(#topLeft)"/>
  <path d="M24 3.6 34.1 23.2 42.4 18.8Z" fill="url(#topRight)"/>
  <!-- faccia frontale, quella che porta il numero -->
  <path d="M24 3.6 13.9 23.2 24 30.6 34.1 23.2Z" fill="url(#front)"/>

  <g fill="none" stroke="#E4D8C4" stroke-opacity="0.55" stroke-width="0.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 3.6 13.9 23.2 24 30.6 34.1 23.2Z"/>
    <path d="M5.6 18.8 13.9 23.2"/>
    <path d="M42.4 18.8 34.1 23.2"/>
    <path d="M13.9 23.2 9.8 33.4"/>
    <path d="M34.1 23.2 38.2 33.4"/>
    <path d="M24 30.6V44.4"/>
  </g>
  <path d="M24 3.6 42.4 18.8 38.2 33.4 24 44.4 9.8 33.4 5.6 18.8Z"
        fill="none" stroke="#EFE4D2" stroke-opacity="0.85" stroke-width="1.1"
        stroke-linejoin="round"/>
  <path d="M24 4.6 15.4 21.4" stroke="#FFFFFF" stroke-opacity="0.22"
        stroke-width="1.2" stroke-linecap="round"/>
</svg>
